<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחשבון יחסי מתכון</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── הדפסה ─── */
@media print {
  @page { size: A4 landscape; margin: 18mm 16mm; }
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea {
    position: fixed; inset: 0;
    font-family: Arial, sans-serif; direction: rtl;
    padding: 0; color: #000;
  }
  .print-title {
    font-size: 22pt; font-weight: bold; margin-bottom: 6mm;
    border-bottom: 2pt solid #000; padding-bottom: 3mm;
  }
  .print-meta { font-size: 10pt; color: #555; margin-bottom: 6mm; }
  .print-table { width: 100%; border-collapse: collapse; font-size: 11pt; margin-bottom: 8mm; }
  .print-table th { background: #203864; color: #fff; padding: 5pt 8pt; text-align: right; }
  .print-table td { padding: 5pt 8pt; border-bottom: 1pt solid #ccc; }
  .print-table .total-row td { font-weight: bold; background: #d0e8b0; }
  .print-instructions-title { font-size: 12pt; font-weight: bold; margin-bottom: 3mm; }
  .print-instructions { font-size: 10pt; line-height: 1.7; white-space: pre-wrap; }
}

body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; direction: rtl; }

header {
  background: #203864; color: #fff;
  padding: 14px 24px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 2px 8px #0003; position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 1.35rem; flex: 1; }
.sync-badge {
  font-size: 0.78rem; background: #e8f5e9; color: #388e3c;
  border-radius: 20px; padding: 3px 12px;
}
.sync-badge.warn { background: #fff8e1; color: #f57f17; }
.sync-badge.err  { background: #fdecea; color: #c62828; }

.layout { display: flex; min-height: calc(100vh - 52px); }

/* ─── סרגל צד ─── */
.sidebar {
  width: 250px; background: #fff; border-left: 1px solid #e0e4ef;
  display: flex; flex-direction: column; flex-shrink: 0;
  overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px;
}
.sb-section { padding: 12px 12px 6px; }
.sb-section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; cursor: pointer; user-select: none;
}
.sb-section-title { font-size: 0.78rem; color: #888; font-weight: bold; letter-spacing: 0.05em; }
.sb-toggle { font-size: 0.7rem; color: #bbb; }
.sb-body { display: flex; flex-direction: column; gap: 5px; }
.sb-body.collapsed { display: none; }

.recipe-btn {
  width: 100%; text-align: right; padding: 8px 10px;
  border: 1px solid #e0e4ef; border-radius: 8px; background: #f8f9fc;
  cursor: pointer; font-size: 0.92rem; transition: background 0.12s;
  display: flex; align-items: center; gap: 6px; overflow: hidden;
}
.recipe-btn-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recipe-btn.active { background: #203864; color: #fff; border-color: #203864; font-weight: bold; }
.recipe-btn:hover:not(.active) { background: #eaedfa; }

.archive-btn-row { display: flex; gap: 4px; }
.arc-action {
  background: none; border: none; cursor: pointer; font-size: 0.85rem;
  padding: 2px 5px; border-radius: 4px; color: #aaa;
}
.arc-action:hover { background: #f0f0f0; color: #555; }

.sb-divider { border: none; border-top: 1px solid #eee; margin: 6px 12px; }

/* archive items */
.arc-item {
  padding: 7px 10px; border-radius: 8px; border: 1px solid #e8e0ff;
  background: #f8f6ff; cursor: pointer; font-size: 0.88rem;
}
.arc-item:hover { background: #ede8ff; }
.arc-item-name { font-weight: bold; color: #5c35be; }
.arc-item-date { font-size: 0.75rem; color: #999; margin-top: 2px; }
.arc-item-actions { display: flex; gap: 4px; margin-top: 5px; }
.arc-tag { font-size: 0.72rem; background: #ede8ff; color: #5c35be; border-radius: 10px; padding: 1px 7px; }

/* new recipe */
.new-row { display: flex; gap: 5px; padding: 8px 12px; }
.new-row input {
  flex: 1; padding: 7px 9px; border: 1px solid #dde; border-radius: 7px;
  font-size: 0.88rem; direction: rtl;
}
.new-row input:focus { outline: none; border-color: #203864; }

.btn {
  padding: 7px 13px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 0.88rem; font-weight: bold; transition: opacity 0.15s; white-space: nowrap;
}
.btn:hover { opacity: 0.83; }
.btn-primary { background: #203864; color: #fff; }
.btn-green   { background: #2e7d32; color: #fff; }
.btn-purple  { background: #5c35be; color: #fff; }
.btn-red     { background: #c62828; color: #fff; }
.btn-outline { background: #fff; color: #203864; border: 1.5px solid #203864; }
.btn-sm      { padding: 5px 10px; font-size: 0.8rem; }
.btn-xs      { padding: 3px 8px; font-size: 0.76rem; }

.sb-btns { display: flex; flex-direction: column; gap: 5px; padding: 0 12px 8px; }
.sb-file-label {
  display: block; padding: 7px 13px; border-radius: 8px; cursor: pointer;
  font-size: 0.88rem; font-weight: bold; text-align: center;
  background: #fff; color: #203864; border: 1.5px solid #203864;
}
.sb-file-label:hover { opacity: 0.83; }

/* ─── אזור ראשי ─── */
.main { flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; max-width: 820px; }

.card { background: #fff; border-radius: 12px; padding: 18px 22px; box-shadow: 0 1px 4px #0001; }

.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-header h2 { font-size: 1.1rem; color: #203864; }

.title-row { display: flex; align-items: center; gap: 10px; }
.title-row input {
  flex: 1; font-size: 1.2rem; font-weight: bold; border: none;
  border-bottom: 2px solid #e0e4ef; padding: 4px 6px; color: #203864;
  background: transparent; direction: rtl;
}
.title-row input:focus { outline: none; border-bottom-color: #203864; }
.title-row .actions { display: flex; gap: 6px; }

.kg-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.kg-row label { font-size: 0.92rem; color: #555; white-space: nowrap; }
.kg-input {
  width: 120px; padding: 7px 11px; border: 1.5px solid #dde; border-radius: 8px;
  font-size: 1rem; font-weight: bold; direction: ltr; text-align: center;
}
.kg-input:focus { outline: none; border-color: #203864; }

/* archived view */
.archived-banner {
  background: #f3f0ff; border: 1.5px solid #c4b5fd; border-radius: 10px;
  padding: 12px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
}
.archived-banner span { flex: 1; color: #5c35be; font-size: 0.92rem; }

/* ingredients table */
table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
th { background: #203864; color: #fff; padding: 8px 10px; text-align: right; font-weight: normal; }
td { padding: 6px 9px; border-bottom: 1px solid #eee; vertical-align: middle; }
tr:nth-child(even) td { background: #f8f9fc; }
tr:hover td { background: #eef2fb; }
td input { width: 100%; border: none; background: transparent; font-size: 0.93rem; direction: rtl; padding: 2px 4px; }
td input[type="number"] { direction: ltr; text-align: center; }
td input:focus { outline: none; border-bottom: 1.5px solid #203864; }
.del-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 4px; }
.del-btn:hover { color: #c62828; background: #fdecea; }
.add-row-btn {
  margin-top: 8px; font-size: 0.88rem; color: #203864; background: none;
  border: 1.5px dashed #b0b8d0; border-radius: 8px; padding: 7px; cursor: pointer; width: 100%;
}
.add-row-btn:hover { background: #f0f4ff; }

/* results */
.metrics { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.metric-card {
  background: #f0f4ff; border-radius: 10px; padding: 11px 16px;
  min-width: 120px; text-align: center; border: 1px solid #d0daef;
}
.metric-name { font-size: 0.78rem; color: #555; margin-bottom: 3px; }
.metric-kg   { font-size: 1.45rem; font-weight: bold; color: #203864; }
.metric-pct  { font-size: 0.78rem; color: #388e3c; }
.results-table .kg-cell { font-weight: bold; color: #203864; }
.results-table .pct-cell { color: #388e3c; }
.total-row td { background: #92d050 !important; font-weight: bold; }

/* export */
.export-row { display: flex; gap: 9px; flex-wrap: wrap; }

/* archive modal */
.modal-bg {
  display: none; position: fixed; inset: 0; background: #0005;
  z-index: 200; align-items: center; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: #fff; border-radius: 14px; padding: 26px 30px;
  max-width: 440px; width: 92%; box-shadow: 0 8px 40px #0003;
}
.modal h3 { color: #203864; margin-bottom: 10px; font-size: 1.05rem; }
.modal p  { color: #555; font-size: 0.88rem; margin-bottom: 10px; line-height: 1.6; }
.modal input {
  width: 100%; padding: 8px 11px; border: 1.5px solid #dde; border-radius: 8px;
  font-size: 0.88rem; margin-bottom: 9px; direction: rtl;
}
.modal input:focus { outline: none; border-color: #203864; }
.modal-footer { display: flex; gap: 9px; justify-content: flex-end; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <span>⚖️</span>
  <h1>מחשבון יחסי מתכון</h1>
  <span id="syncBadge" class="sync-badge" style="display:none"></span>
</header>

<div class="layout">

<!-- ─── סרגל צד ─── -->
<aside class="sidebar">

  <!-- מתכונים פעילים -->
  <div class="sb-section">
    <div class="sb-section-header" onclick="toggleSection('active')">
      <span class="sb-section-title">📋 מתכונים פעילים</span>
      <span class="sb-toggle" id="toggle-active">▲</span>
    </div>
    <div class="sb-body" id="section-active"></div>
  </div>

  <div class="new-row">
    <input type="text" id="newRecipeName" placeholder="מתכון חדש..." onkeydown="if(event.key==='Enter') addRecipe()">
    <button class="btn btn-primary" onclick="addRecipe()">+</button>
  </div>

  <hr class="sb-divider">

  <!-- ארכיון -->
  <div class="sb-section">
    <div class="sb-section-header" onclick="toggleSection('archive')">
      <span class="sb-section-title">📦 ארכיון (<span id="archiveCount">0</span>)</span>
      <span class="sb-toggle" id="toggle-archive">▼</span>
    </div>
    <div class="sb-body collapsed" id="section-archive"></div>
  </div>

  <hr class="sb-divider">

  <!-- קובץ -->
  <div class="sb-section">
    <div class="sb-section-header" onclick="toggleSection('file')">
      <span class="sb-section-title">💾 קובץ</span>
      <span class="sb-toggle" id="toggle-file">▼</span>
    </div>
    <div class="sb-body collapsed" id="section-file">
      <button class="btn btn-primary btn-sm" onclick="saveToFile()" style="width:100%">💾 שמור לקובץ</button>
      <label class="sb-file-label btn-sm">
        📂 טען מקובץ
        <input type="file" id="jsonFileInput" accept=".json" onchange="loadFromFile()" style="display:none">
      </label>
      <label class="sb-file-label btn-sm" style="color:#388e3c; border-color:#388e3c">
        📊 ייבוא Excel
        <input type="file" id="fileInput" accept=".xlsx" onchange="importExcel()" style="display:none">
      </label>
    </div>
  </div>

</aside>

<!-- ─── אזור ראשי ─── -->
<main class="main" id="mainArea"></main>

</div>

<!-- ─── אזור הדפסה (נסתר, מוצג רק בהדפסה) ─── -->
<div id="printArea" style="display:none"></div>

<!-- ─── Modal: ארכיון ─── -->
<div class="modal-bg" id="archiveModal">
  <div class="modal">
    <h3>📦 העבר לארכיון</h3>
    <p>המתכון יועבר לארכיון ויישמר שם. תוכל לשחזר אותו בכל עת.</p>
    <label style="font-size:0.85rem;color:#555">הערה (אופציונלי):</label>
    <input type="text" id="archiveNote" placeholder="למה גנזת? גרסה ישנה, עונתי, הוחלף...">
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('archiveModal')">ביטול</button>
      <button class="btn btn-purple btn-sm" onclick="confirmArchive()">📦 העבר לארכיון</button>
    </div>
  </div>
</div>

<!-- ─── Modal: שחזור ─── -->
<div class="modal-bg" id="restoreModal">
  <div class="modal">
    <h3>♻️ שחזר מתכון</h3>
    <p id="restoreMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('restoreModal')">ביטול</button>
      <button class="btn btn-green btn-sm" onclick="confirmRestore()">♻️ שחזר</button>
    </div>
  </div>
</div>

<!-- ─── Modal: מחיקה מארכיון ─── -->
<div class="modal-bg" id="deleteArcModal">
  <div class="modal">
    <h3>🗑 מחק לצמיתות</h3>
    <p id="deleteArcMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('deleteArcModal')">ביטול</button>
      <button class="btn btn-red btn-sm" onclick="confirmDeleteArc()">🗑 מחק</button>
    </div>
  </div>
</div>

<script>
// ─── מצב ─────────────────────────────────────────────────────────────────────
let state = {
  recipes: { "מתכון חדש": { ingredients: [{ name: "רכיב 1", ratio: 1 }], totalKg: 10 } },
  archive: {},   // { name: { ingredients, totalKg, archivedAt, note } }
  active: "מתכון חדש",
  view: "recipe" // "recipe" | "archive"
};

let _pendingArchive = null;
let _pendingRestore = null;
let _pendingDeleteArc = null;

// ─── LocalStorage ─────────────────────────────────────────────────────────────
function save() { localStorage.setItem("recipeCalc_v2", JSON.stringify(state)); }
function loadState() {
  const raw = localStorage.getItem("recipeCalc_v2") || localStorage.getItem("recipeCalc");
  if (!raw) return;
  try {
    const p = JSON.parse(raw);
    if (p.recipes) {
      state.recipes = p.recipes;
      state.archive = p.archive || {};
      state.active  = p.active  || Object.keys(p.recipes)[0];
    }
    // migrate
    for (const k in state.recipes)
      if (Array.isArray(state.recipes[k]))
        state.recipes[k] = { ingredients: state.recipes[k], totalKg: 10 };
    for (const k in state.archive)
      if (Array.isArray(state.archive[k]))
        state.archive[k] = { ingredients: state.archive[k], totalKg: 10, archivedAt: "", note: "" };
  } catch(e) {}
}

// ─── סרגל צד ─────────────────────────────────────────────────────────────────
function toggleSection(id) {
  const body    = document.getElementById("section-" + id);
  const toggle  = document.getElementById("toggle-" + id);
  const open    = !body.classList.contains("collapsed");
  body.classList.toggle("collapsed", open);
  toggle.textContent = open ? "▼" : "▲";
}

function renderSidebar() {
  // פעילים
  const actEl = document.getElementById("section-active");
  actEl.innerHTML = "";
  for (const name in state.recipes) {
    const div = document.createElement("div");
    div.className = "recipe-btn" + (state.view === "recipe" && name === state.active ? " active" : "");
    div.innerHTML = `
      <span class="recipe-btn-name">${esc(name)}</span>
      <span title="העבר לארכיון" class="arc-action" onclick="openArchiveModal('${esc(name)}');event.stopPropagation()">📦</span>
    `;
    div.onclick = () => { state.active = name; state.view = "recipe"; save(); renderAll(); };
    actEl.appendChild(div);
  }

  // ארכיון
  const arcEl    = document.getElementById("section-archive");
  const arcCount = document.getElementById("archiveCount");
  const arcKeys  = Object.keys(state.archive);
  arcCount.textContent = arcKeys.length;
  arcEl.innerHTML = "";
  if (!arcKeys.length) {
    arcEl.innerHTML = `<div style="font-size:0.82rem;color:#bbb;padding:4px 2px">הארכיון ריק</div>`;
  } else {
    arcKeys.forEach(name => {
      const item = state.archive[name];
      const date = item.archivedAt ? new Date(item.archivedAt).toLocaleDateString("he-IL") : "";
      const div  = document.createElement("div");
      div.className = "arc-item" + (state.view === "archive" && state.active === name ? " active" : "");
      div.innerHTML = `
        <div class="arc-item-name">${esc(name)}</div>
        ${item.note ? `<div class="arc-item-date">${esc(item.note)}</div>` : ""}
        <div class="arc-item-date">גונז: ${date}</div>
        <div class="arc-item-actions">
          <button class="btn btn-green btn-xs" onclick="openRestoreModal('${esc(name)}');event.stopPropagation()">♻️ שחזר</button>
          <button class="btn btn-red btn-xs" onclick="openDeleteArcModal('${esc(name)}');event.stopPropagation()">🗑 מחק</button>
        </div>`;
      div.onclick = () => { state.active = name; state.view = "archive"; save(); renderAll(); };
      arcEl.appendChild(div);
    });
  }
}

// ─── אזור ראשי ───────────────────────────────────────────────────────────────
function renderMain() {
  const main = document.getElementById("mainArea");
  if (state.view === "archive") {
    renderArchiveView(main);
  } else {
    renderRecipeView(main);
  }
}

function renderRecipeView(main) {
  const recipe = state.recipes[state.active];
  if (!recipe) return;

  main.innerHTML = `
    <!-- כותרת -->
    <div class="card">
      <div class="title-row">
        <input type="text" id="recipeTitle" value="${esc(state.active)}" placeholder="שם המתכון" oninput="renameCurrentRecipe(this.value)">
        <div class="actions">
          <button class="btn btn-purple btn-sm" onclick="openArchiveModal('${esc(state.active)}')">📦 לארכיון</button>
          <button class="btn btn-red btn-sm" onclick="deleteRecipe()">🗑</button>
        </div>
      </div>
      <div class="kg-row">
        <label>סה"כ ק"ג לאצווה:</label>
        <input type="number" class="kg-input" id="totalKg" value="${recipe.totalKg || 10}" min="0.001" step="0.5" oninput="updateAll()">
      </div>
    </div>

    <!-- רכיבים -->
    <div class="card">
      <div class="card-header"><h2>רכיבים ויחסים</h2></div>
      <table><thead><tr>
        <th>שם רכיב</th>
        <th style="width:110px;text-align:center">יחס</th>
        <th style="width:36px"></th>
      </tr></thead>
      <tbody id="ingBody"></tbody></table>
      <button class="add-row-btn" onclick="addIngredient()">+ הוסף רכיב</button>
    </div>

    <!-- תוצאות -->
    <div class="card" id="resultsCard" style="display:none">
      <div class="card-header"><h2>📊 תוצאות</h2></div>
      <div class="metrics" id="metricsRow"></div>
      <table class="results-table"><thead><tr>
        <th>רכיב</th>
        <th style="text-align:center;width:80px">יחס</th>
        <th style="text-align:center;width:90px">אחוז</th>
        <th style="text-align:center;width:110px">ק"ג</th>
      </tr></thead>
      <tbody id="resultsBody"></tbody></table>
    </div>

    <!-- הוראות הכנה -->
    <div class="card">
      <div class="card-header"><h2>📝 הוראות הכנה <span style="font-size:0.78rem;color:#aaa;font-weight:normal">(אופציונלי — יופיע בהדפסה)</span></h2></div>
      <textarea id="instructions" rows="4" placeholder="פרט את שלבי ההכנה כאן..." oninput="saveInstructions(this.value)"
        style="width:100%;padding:10px;border:1.5px solid #dde;border-radius:8px;font-size:0.92rem;font-family:Arial;direction:rtl;resize:vertical"
      >${esc(recipe.instructions || "")}</textarea>
    </div>

    <!-- ייצוא + הדפסה -->
    <div class="card">
      <div class="card-header"><h2>💾 ייצוא והדפסה</h2></div>
      <div class="export-row">
        <button class="btn btn-green" onclick="exportExcel(false)">📥 Excel נוכחי</button>
        <button class="btn btn-outline" onclick="exportExcel(true)">📥 כל המתכונים</button>
        <button class="btn btn-primary" onclick="printRecipe()">🖨️ הדפסה</button>
      </div>
    </div>`;

  renderIngredients();
  renderResults();
}

function renderArchiveView(main) {
  const item = state.archive[state.active];
  if (!item) return;
  const date = item.archivedAt ? new Date(item.archivedAt).toLocaleDateString("he-IL") : "";
  const totalRatio = item.ingredients.filter(r => r.name && r.ratio > 0).reduce((s,r) => s+r.ratio, 0);

  const rows = item.ingredients.filter(r => r.name && r.ratio > 0).map(r => {
    const pct = totalRatio ? (r.ratio/totalRatio*100).toFixed(2) : 0;
    const kg  = totalRatio ? (r.ratio/totalRatio*(item.totalKg||10)).toFixed(3) : 0;
    return `<tr>
      <td>${esc(r.name)}</td>
      <td style="text-align:center">${r.ratio}</td>
      <td class="pct-cell" style="text-align:center">${pct}%</td>
      <td class="kg-cell" style="text-align:center">${kg} ק"ג</td>
    </tr>`;
  }).join("");

  main.innerHTML = `
    <div class="card">
      <div class="archived-banner">
        <span>📦 <strong>${esc(state.active)}</strong> — בארכיון מ-${date}${item.note ? " · " + esc(item.note) : ""}</span>
        <button class="btn btn-green btn-sm" onclick="openRestoreModal('${esc(state.active)}')">♻️ שחזר</button>
        <button class="btn btn-red btn-sm" onclick="openDeleteArcModal('${esc(state.active)}')">🗑 מחק</button>
      </div>
      <div class="kg-row" style="margin-top:8px">
        <label>אצווה:</label>
        <span style="font-weight:bold;font-size:1rem">${item.totalKg || 10} ק"ג</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h2>רכיבים ויחסים</h2></div>
      <table class="results-table"><thead><tr>
        <th>רכיב</th>
        <th style="text-align:center;width:80px">יחס</th>
        <th style="text-align:center;width:90px">אחוז</th>
        <th style="text-align:center;width:110px">ק"ג</th>
      </tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
}

// ─── רכיבים ──────────────────────────────────────────────────────────────────
function renderIngredients() {
  const recipe = state.recipes[state.active];
  const body   = document.getElementById("ingBody");
  if (!body) return;
  body.innerHTML = "";
  recipe.ingredients.forEach((ing, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="text" value="${esc(ing.name)}" oninput="setName(${i},this.value)" placeholder="שם רכיב"></td>
      <td><input type="number" value="${ing.ratio}" min="0" step="0.01" oninput="setRatio(${i},this.value)" style="width:90px"></td>
      <td><button class="del-btn" onclick="delIng(${i})">✕</button></td>`;
    body.appendChild(tr);
  });
}

function setName(i,v)  { state.recipes[state.active].ingredients[i].name=v; updateAll(); }
function setRatio(i,v) { state.recipes[state.active].ingredients[i].ratio=parseFloat(v)||0; updateAll(); }
function delIng(i) { state.recipes[state.active].ingredients.splice(i,1); renderIngredients(); updateAll(); }
function addIngredient() {
  state.recipes[state.active].ingredients.push({ name:"", ratio:1 });
  renderIngredients();
  const inputs = document.querySelectorAll("#ingBody input[type=text]");
  if (inputs.length) inputs[inputs.length-1].focus();
}

// ─── תוצאות ──────────────────────────────────────────────────────────────────
function renderResults() {
  const recipe   = state.recipes[state.active];
  const totalKg  = parseFloat(document.getElementById("totalKg")?.value) || 0;
  const valid    = recipe.ingredients.filter(r => r.name && r.ratio > 0);
  const totalR   = valid.reduce((s,r) => s+r.ratio, 0);
  const card     = document.getElementById("resultsCard");
  if (!card) return;
  if (!valid.length || !totalR) { card.style.display="none"; return; }
  card.style.display = "";

  document.getElementById("metricsRow").innerHTML = valid.slice(0,4).map(r => {
    const kg = (r.ratio/totalR*totalKg).toFixed(3);
    const pct = (r.ratio/totalR*100).toFixed(1);
    return `<div class="metric-card">
      <div class="metric-name">${esc(r.name)}</div>
      <div class="metric-kg">${kg}</div>
      <div class="metric-pct">▲ ${pct}%</div>
    </div>`;
  }).join("");

  document.getElementById("resultsBody").innerHTML =
    valid.map(r => {
      const kg = (r.ratio/totalR*totalKg).toFixed(3);
      const pct = (r.ratio/totalR*100).toFixed(2);
      return `<tr>
        <td>${esc(r.name)}</td>
        <td style="text-align:center">${r.ratio}</td>
        <td class="pct-cell" style="text-align:center">${pct}%</td>
        <td class="kg-cell" style="text-align:center">${kg} ק"ג</td>
      </tr>`;
    }).join("") + `<tr class="total-row">
      <td>סה"כ</td>
      <td style="text-align:center">${totalR}</td>
      <td style="text-align:center">100%</td>
      <td style="text-align:center">${totalKg.toFixed(3)} ק"ג</td>
    </tr>`;
}

function updateAll() {
  const recipe = state.recipes[state.active];
  if (!recipe) return;
  recipe.totalKg = parseFloat(document.getElementById("totalKg")?.value) || 10;
  save();
  renderResults();
}

function renderAll() {
  renderSidebar();
  renderMain();
}

// ─── ניהול מתכונים ───────────────────────────────────────────────────────────
function addRecipe() {
  const inp  = document.getElementById("newRecipeName");
  const name = inp.value.trim() || "מתכון " + (Object.keys(state.recipes).length + 1);
  if (state.recipes[name]) { inp.select(); return; }
  state.recipes[name] = { ingredients: [{ name:"רכיב 1", ratio:1 }], totalKg:10 };
  state.active = name; state.view = "recipe";
  inp.value = "";
  save(); renderAll();
}

function deleteRecipe() {
  const keys = Object.keys(state.recipes);
  if (keys.length <= 1) return;
  if (!confirm(`למחוק את "${state.active}"?`)) return;
  delete state.recipes[state.active];
  state.active = Object.keys(state.recipes)[0];
  state.view = "recipe";
  save(); renderAll();
}

function renameCurrentRecipe(newName) {
  if (!newName || newName === state.active || state.recipes[newName]) return;
  const old = state.active;
  state.recipes[newName] = state.recipes[old];
  delete state.recipes[old];
  state.active = newName;
  save(); renderSidebar();
}

// ─── ארכיון ──────────────────────────────────────────────────────────────────
function openArchiveModal(name) {
  _pendingArchive = name;
  document.getElementById("archiveNote").value = "";
  document.getElementById("archiveModal").classList.add("open");
}
function confirmArchive() {
  const name = _pendingArchive;
  const note = document.getElementById("archiveNote").value.trim();
  if (!name || !state.recipes[name]) return;
  state.archive[name] = {
    ...state.recipes[name],
    archivedAt: new Date().toISOString(),
    note,
  };
  delete state.recipes[name];
  const keys = Object.keys(state.recipes);
  state.active = keys.length ? keys[0] : null;
  state.view   = keys.length ? "recipe" : "archive";
  if (!keys.length && Object.keys(state.archive).length) {
    state.active = Object.keys(state.archive)[0];
    state.view   = "archive";
  }
  closeModal("archiveModal");
  save(); renderAll();

  // open archive section if closed
  const arcBody = document.getElementById("section-archive");
  if (arcBody.classList.contains("collapsed")) toggleSection("archive");
}

function openRestoreModal(name) {
  _pendingRestore = name;
  document.getElementById("restoreMsg").innerHTML =
    `האם לשחזר את <strong>${esc(name)}</strong> בחזרה למתכונים הפעילים?`;
  document.getElementById("restoreModal").classList.add("open");
}
function confirmRestore() {
  const name = _pendingRestore;
  if (!name || !state.archive[name]) return;
  const { archivedAt, note, ...recipe } = state.archive[name];
  let targetName = name;
  // אם קיים כבר מתכון עם אותו שם — הוסף סיומת
  if (state.recipes[targetName]) targetName = name + " (שוחזר)";
  state.recipes[targetName] = recipe;
  delete state.archive[name];
  state.active = targetName; state.view = "recipe";
  closeModal("restoreModal");
  save(); renderAll();
}

function openDeleteArcModal(name) {
  _pendingDeleteArc = name;
  document.getElementById("deleteArcMsg").innerHTML =
    `למחוק לצמיתות את <strong>${esc(name)}</strong> מהארכיון? לא ניתן לשחזר.`;
  document.getElementById("deleteArcModal").classList.add("open");
}
function confirmDeleteArc() {
  const name = _pendingDeleteArc;
  if (!name) return;
  delete state.archive[name];
  if (state.view === "archive" && state.active === name) {
    const arcKeys = Object.keys(state.archive);
    const recKeys = Object.keys(state.recipes);
    if (arcKeys.length) { state.active = arcKeys[0]; state.view = "archive"; }
    else if (recKeys.length) { state.active = recKeys[0]; state.view = "recipe"; }
  }
  closeModal("deleteArcModal");
  save(); renderAll();
}

function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}

// ─── הוראות הכנה ─────────────────────────────────────────────────────────────
function saveInstructions(val) {
  state.recipes[state.active].instructions = val;
  save();
}

// ─── הדפסה ───────────────────────────────────────────────────────────────────
function printRecipe() {
  const recipe     = state.recipes[state.active];
  const totalKg    = parseFloat(document.getElementById("totalKg")?.value) || recipe.totalKg || 10;
  const valid      = recipe.ingredients.filter(r => r.name && r.ratio > 0);
  const totalR     = valid.reduce((s, r) => s + r.ratio, 0);
  const date       = new Date().toLocaleDateString("he-IL");
  const instrText  = (recipe.instructions || "").trim();

  const rows = valid.map(r => {
    const kg = totalR ? (r.ratio / totalR * totalKg).toFixed(3) : "0";
    return `<tr><td>${esc(r.name)}</td><td style="text-align:center">${kg} ק"ג</td></tr>`;
  }).join("") + `<tr class="total-row">
    <td><strong>סה"כ</strong></td>
    <td style="text-align:center"><strong>${totalKg.toFixed(3)} ק"ג</strong></td>
  </tr>`;

  const instrBlock = instrText ? `
    <div class="print-instructions-title">הוראות הכנה</div>
    <div class="print-instructions">${esc(instrText)}</div>` : "";

  document.getElementById("printArea").innerHTML = `
    <div class="print-title">${esc(state.active)}</div>
    <div class="print-meta">אצווה: ${totalKg} ק"ג &nbsp;|&nbsp; תאריך: ${date}</div>
    <table class="print-table">
      <thead><tr>
        <th>תיאור פריט</th>
        <th style="width:140px;text-align:center">כמות (ק"ג)</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${instrBlock}`;

  document.getElementById("printArea").style.display = "";
  window.print();
  document.getElementById("printArea").style.display = "none";
}

// ─── קובץ JSON ───────────────────────────────────────────────────────────────
function saveToFile() {
  const blob = new Blob([JSON.stringify({ recipes: state.recipes, archive: state.archive, active: state.active }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "מתכונים.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadFromFile() {
  const file = document.getElementById("jsonFileInput").files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const p = JSON.parse(e.target.result);
      if (p.recipes) {
        state.recipes = p.recipes;
        state.archive = p.archive || {};
        state.active  = p.active && p.recipes[p.active] ? p.active : Object.keys(p.recipes)[0];
        state.view    = "recipe";
        for (const k in state.recipes) if (Array.isArray(state.recipes[k])) state.recipes[k] = { ingredients:state.recipes[k], totalKg:10 };
        for (const k in state.archive) if (Array.isArray(state.archive[k])) state.archive[k] = { ingredients:state.archive[k], totalKg:10, archivedAt:"", note:"" };
        save(); renderAll();
        showBadge("נטען ✓");
      } else alert("קובץ לא תקין");
    } catch(err) { alert("שגיאה: " + err.message); }
    document.getElementById("jsonFileInput").value = "";
  };
  reader.readAsText(file);
}

// ─── ייבוא Excel ─────────────────────────────────────────────────────────────
function importExcel() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type:"binary" });
    let count = 0;
    wb.SheetNames.forEach(sName => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sName], { header:1 });
      if (!rows.length) return;
      const hdr = rows[0].map(h => String(h).trim());
      const iI  = hdr.indexOf("רכיב"), rI = hdr.indexOf("יחס"), kI = hdr.indexOf('סה"כ ק"ג');
      if (iI<0||rI<0) return;
      const ings = []; let kg = 10;
      rows.slice(1).forEach(r => {
        const n = String(r[iI]||"").trim(), ratio = parseFloat(r[rI])||0;
        if (n && ratio > 0) { if (kI>=0&&r[kI]) kg=parseFloat(r[kI])||10; ings.push({name:n,ratio}); }
      });
      if (ings.length) { state.recipes[sName] = {ingredients:ings, totalKg:kg}; state.active=sName; count++; }
    });
    save(); renderAll();
    if (count) showBadge(`יובאו ${count} מתכונים`);
    document.getElementById("fileInput").value = "";
  };
  reader.readAsBinaryString(file);
}

// ─── ייצוא Excel ─────────────────────────────────────────────────────────────
function exportExcel(all) {
  const wb  = XLSX.utils.book_new();
  const src = all ? state.recipes : { [state.active]: state.recipes[state.active] };
  for (const [name, recipe] of Object.entries(src)) {
    const totalKg = recipe.totalKg||10;
    const valid   = recipe.ingredients.filter(r=>r.name&&r.ratio>0);
    const totalR  = valid.reduce((s,r)=>s+r.ratio,0);
    const rows    = [['רכיב','יחס','אחוז %','ק"ג']];
    valid.forEach(r => rows.push([r.name, r.ratio, totalR?(r.ratio/totalR*100).toFixed(2)+"%":"0%", totalR?(r.ratio/totalR*totalKg).toFixed(3)+' ק"ג':"0"]));
    rows.push(['סה"כ', totalR, '100%', totalKg+' ק"ג']);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:28},{wch:10},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  }
  XLSX.writeFile(wb, `מתכון_${new Date().toISOString().slice(0,10).replace(/-/g,"")}.xlsx`);
}

// ─── עזר ─────────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function showBadge(text, ms=2200) {
  const el = document.getElementById("syncBadge");
  el.textContent=text; el.style.display="";
  setTimeout(()=>el.style.display="none", ms);
}

// ─── אתחול ───────────────────────────────────────────────────────────────────
loadState();
renderAll();
</script>
</body>
</html>
